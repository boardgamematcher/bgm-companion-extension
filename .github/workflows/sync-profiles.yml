name: Sync built-in profiles

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest profiles.json
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/boardgamematcher/site-profiles/main/profiles.json \
            -o patterns/built-in.json

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync built-in profiles from site-profiles"
          title: "chore: sync built-in profiles from site-profiles"
          body: "Automated sync from [boardgamematcher/site-profiles](https://github.com/boardgamematcher/site-profiles)."
          branch: chore/sync-built-in-profiles
          delete-branch: true
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
